name: Weekly/Daily Pipeline

on:
  schedule:
    # Every day at 02:00 UTC (adjust to your local time)
    - cron: '0 2 * * *'
  workflow_dispatch:   # allow manual trigger from the GitHub UI

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      # Secrets stored in repo Settings → Secrets → Actions
      EARTHENGINE_EMAIL: ${{ secrets.EARTHENGINE_EMAIL }}
      EARTHENGINE_KEY:   ${{ secrets.EARTHENGINE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # we need full history to push back

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine run type (daily vs weekly)
        id: check_date
        run: |
          # If today is Sunday (weekday 0) → weekly run, else daily
          DAY=$(date +%u)   # 1=Mon … 7=Sun
          if [ "$DAY" -eq 7 ]; then
            echo "RUN_TYPE=weekly" >> $GITHUB_OUTPUT
          else
            echo "RUN_TYPE=daily" >> $GITHUB_OUTPUT
          fi

      - name: Run orchestrator (passing run type)
        run: |
          python orchestrator/run_pipeline.py ${{ steps.check_date.outputs.RUN_TYPE }}
        env:
          PYTHONUNBUFFERED: 1   # ensure logs appear in real time

      - name: Commit and push updated data/maps
        # Only commit if there are changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ processed/ models/ maps/ || true
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Automated pipeline update: ${{ steps.check_date.outputs.RUN_TYPE }} run"
            git push
          else
            echo "No changes to commit."
          fi

