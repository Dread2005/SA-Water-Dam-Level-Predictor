name: Weekly/Daily Pipeline
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Refresh mode (offline builds committed data only)'
        type: choice
        options: [auto, daily, weekly, offline]
        default: auto
permissions:
  contents: write
concurrency:
  group: rainfall-refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Determine run type
        id: mode
        env:
          REQUESTED: ${{ inputs.run_type }}
        run: |
          MODE="${REQUESTED:-auto}"
          if [ "$MODE" = auto ]; then
            if [ "$(date -u +%u)" = 7 ]; then MODE=weekly; else MODE=daily; fi
          fi
          case "$MODE" in daily|weekly|offline) ;; *) exit 1 ;; esac
          echo "value=$MODE" >> "$GITHUB_OUTPUT"
      - name: Refresh and build
        env:
          EARTHENGINE_EMAIL: ${{ secrets.EARTHENGINE_EMAIL }}
          EARTHENGINE_KEY: ${{ secrets.EARTHENGINE_KEY }}
          EARTHENGINE_PROJECT: ${{ vars.EARTHENGINE_PROJECT || 'global-calling-450111-e2' }}
          RUN_TYPE: ${{ steps.mode.outputs.value }}
        run: python orchestrator/run_pipeline.py "$RUN_TYPE"
      - name: Upload deployable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rainfall-outputs-${{ github.run_id }}
          path: |
            models/
            maps/
            data/processed/
          if-no-files-found: error
      - name: Commit refreshed source inputs
        if: github.ref == 'refs/heads/main' && steps.mode.outputs.value != 'offline'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/resources/rainfall.json src/resources/all_dams_weekly.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh rainfall and dam source inputs'
            git push origin HEAD:main
          fi
